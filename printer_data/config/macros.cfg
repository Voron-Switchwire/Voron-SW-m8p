[gcode_macro PRINT_START]
gcode:
    # 1. Variablen aus Orca Slicer übernehmen (identisch zum 2.4)
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(190)|float %}
    # Chamber-Variablen werden ausgelesen, aber vom Switchwire ignoriert
    {% set CHAMBER = params.CHAMBER|default(0)|float %}
    {% set CHAMBER_MINIMAL = params.CHAMBER_MINIMAL|default(0)|float %}
    
    # 2. Bett aufheizen (ohne zu warten)
    M140 S{BED}

    # 3. Warten, bis das Bett die Zieltemperatur erreicht hat
    M190 S{BED}

    # 4. Nozzle auf eine sichere Homing-/Probing-Temperatur heizen (z.B. 150°C, verhindert Oozing)
    M109 S150

    # 5. Homing und Mesh
    BED_MESH_CLEAR
    G28
    
    # Optional: CLEAN_NOZZLE hier einfügen, falls eine Bürste montiert ist
    # CLEAN_NOZZLE
    
    # KAMP Exclude Object und Adaptive Mesh
    EXCLUDE_OBJECT_DEFINE
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5

    # 6. Hotend auf finale Drucktemperatur bringen
    M109 S{EXTRUDER}
    
    # Optional: Erneute Reinigung vor dem Druck
    # CLEAN_NOZZLE

    # 7. Startvorbereitungen
    status_printing
    G90
    G92 E0
    
    # KAMP Line Purge / Voron Purge aufrufen (ersetzt die manuellen Linien)
    VORON_PURGE



[gcode_macro PRINT_END]
gcode:
    # Hier kommt später die Struktur deines 2.4 rein (abkühlen, Z anheben, Motoren aus)
    M400                           ; Warte auf Puffer-Leerung
    G92 E0                         ; Extruder nullen
    G1 E-2.0 F3600                 ; Filament leicht zurückziehen
    G91                            ; Relative Positionierung
    G0 Z20.00 X20.0 Y20.0 F20000   ; Werkzeugkopf weg bewegen
    
    TURN_OFF_HEATERS
    M107                           ; Bauteillüfter aus
    G90                            ; Absolute Positionierung
    # Parkposition (entsprechend deiner Switchwire-Größe)
    G0 X125 Y210 F3600
  
