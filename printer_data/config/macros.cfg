[gcode_macro PRINT_START]
gcode:
    # 1. Variablen aus dem Orca Slicer übernehmen (entsprechend dem V2.4 Profil)
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    # Chamber wird hier abgefangen, damit es keinen Fehler gibt, aber ignoriert
    {% set target_chamber = params.CHAMBER|default(0)|int %} 

    # 2. Bett aufheizen (ohne zu warten, damit Homing parallel laufen kann)
    M140 S{target_bed}

    # 3. Homing (G28 nutzt deine safe_z_home Einstellungen)
    G28

    # 4. Warten, bis das Bett die Zieltemperatur erreicht hat
    M190 S{target_bed}

    # 5. KAMP Adaptive Bed Mesh
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # 6. Hotend auf Zieltemperatur bringen
    M109 S{target_extruder}

    # 7. KAMP Purge (z.B. Voron Purge)
    VORON_PURGE

[gcode_macro PRINT_END]
gcode:
    # Hier kommt später die Struktur deines 2.4 rein (abkühlen, Z anheben, Motoren aus)
    M400                           ; Warte auf Puffer-Leerung
    G92 E0                         ; Extruder nullen
    G1 E-2.0 F3600                 ; Filament leicht zurückziehen
    G91                            ; Relative Positionierung
    G0 Z20.00 X20.0 Y20.0 F20000   ; Werkzeugkopf weg bewegen
    
    TURN_OFF_HEATERS
    M107                           ; Bauteillüfter aus
    G90                            ; Absolute Positionierung
    # Parkposition (entsprechend deiner Switchwire-Größe)
    G0 X125 Y210 F3600
  
